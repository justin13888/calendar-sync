# Weekly dependency updates.
#
# Every update's commit message, and so its pull request title, must pass `cog verify` (cog.toml).
# `prefix` and `prefix-development` are both set: without the second, development dependencies get
# a `deps-dev` scope, which cog.toml rejects. Dependabot appends the `: ` after the prefix.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    # Semver-compatible updates arrive as one pull request; each breaking update gets its own.
    groups:
      cargo:
        update-types: [minor, patch]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
