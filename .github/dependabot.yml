# Weekly dependency updates.
#
# Every update's commit message, and so its pull request title, must pass `cog verify` (cog.toml).
# `prefix` and `prefix-development` are both set: without the second, development dependencies get
# a `deps-dev` scope, which cog.toml rejects. Dependabot appends the `: ` after the prefix.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    # Minor and patch updates arrive as one pull request; each major update gets its own. Under
    # Cargo semver a minor bump of a 0.x crate (0.4 -> 0.5) is breaking, yet Dependabot still
    # calls it minor, so it lands in this group too. CI on the group pull request catches the
    # break; to split one out, add it to an `exclude-patterns` list here.
    groups:
      cargo:
        update-types: [minor, patch]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
