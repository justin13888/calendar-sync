name: release-plz

# Release flow (CONTRIBUTING.md): every push to master opens or updates the release pull request;
# merging that pull request publishes the crates it bumps. Configuration is in release-plz.toml.
#
# The release pull request is opened with the RELEASE_PLZ_TOKEN secret, a maintainer's
# fine-grained personal access token: a pull request opened with the default GITHUB_TOKEN starts no
# `pull_request` workflow, so ci.yml would never run on it. Crates are published through crates.io
# trusted publishing, with no stored registry token.

on:
  push:
    branches: [master]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Each job installs only the mise tools it names.
  MISE_AUTO_INSTALL: "false"

jobs:
  # Publishes the crates whose version is not on crates.io yet, then tags them and creates their
  # GitHub releases. With `release_always = false` this only acts on a merged release pull request.
  #
  # No concurrency group, as in release-plz's documented workflow: a group keeps at most one
  # pending run and cancels the one before it, so a push queued behind a running release would
  # cancel the pending run for a just-merged release pull request, and the later run, not being a
  # release pull request merge, would publish and tag nothing. Overlapping runs are safe, because
  # `release-plz release` skips every version already on crates.io.
  release:
    name: release
    if: github.repository == 'justin13888/calendar-sync'
    runs-on: ubuntu-latest
    permissions:
      # Tags and GitHub releases
      contents: write
      # The OIDC token crates.io trusted publishing exchanges for a short-lived publish token
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: release-plz
          cache: false
      # A crate is publishable unless its Cargo.toml sets `publish = false` (`cargo metadata`
      # reports that as `[]`). Trusted publishing can only be configured for a crate that already
      # has a release on crates.io, and a crate's first release is manual (CONTRIBUTING.md), so
      # until a publishable crate is on crates.io the token exchange below would fail. Count only
      # publishable crates the crates.io index knows; an index answer other than 200 or 404 fails.
      #
      # The names are captured in a variable before the loop: a command substitution in a `for`
      # word list discards its exit status, so a failing `cargo metadata` would give count=0 and
      # a green job that publishes nothing. The default `bash -e` shell sets no pipefail, so it is
      # set here for the `cargo metadata | jq` pipe.
      - name: Count the publishable crates already on crates.io
        id: publishable
        run: |
          set -o pipefail
          names="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish != []) | .name')"
          count=0
          for name in $names; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://index.crates.io/${name:0:2}/${name:2:2}/${name}")"
            case "$status" in
              200) count=$((count + 1)) ;;
              404) echo "$name has no release on crates.io yet; its first publish is manual" ;;
              *) echo "the crates.io index answered $status for $name" >&2; exit 1 ;;
            esac
          done
          echo "publishable crates on crates.io: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Get a crates.io token through trusted publishing
        id: crates-io-auth
        if: steps.publishable.outputs.count != '0'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish, tag and release
        if: steps.publishable.outputs.count != '0'
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: release-plz release

  # Opens the release pull request, or updates the open one, with the version bumps and changelogs
  # the commits since the last release call for.
  release-pr:
    name: release-pr
    if: github.repository == 'justin13888/calendar-sync'
    runs-on: ubuntu-latest
    # The release branch is pushed and the pull request opened with RELEASE_PLZ_TOKEN, so the
    # default token only reads.
    permissions:
      contents: read
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # With the secret unset, release-plz would fail later with a less useful error.
      # CONTRIBUTING.md, "Maintainer setup", lists the permissions the token needs.
      - name: Require RELEASE_PLZ_TOKEN
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLZ_TOKEN" ]; then
            echo "::error::The RELEASE_PLZ_TOKEN secret is not set (CONTRIBUTING.md, \"Maintainer setup\")"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # `semver_check = true` runs cargo-semver-checks against the last published version.
          install_args: release-plz github:obi1kenobi/cargo-semver-checks
          cache: false
      # release-plz commits the version bumps locally before sending them to GitHub.
      - name: Configure the git author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Opened with the PAT, the pull request triggers ci.yml's `pull_request` run like any other.
      - name: Open or update the release pull request
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: release-plz release-pr
