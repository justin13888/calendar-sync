name: Scheduled

on:
  schedule:
    # Mondays at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  references-upstream:
    name: references upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
      # Downloads every vendored reference again. A pinned source that changed fails the run; a
      # snapshot (the Google discovery document, the RFC 5545 errata page) that drifted is reported.
      - run: mise run references:upstream

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # cargo-fuzz needs nightly for its sanitizer flags. Only this job uses it, pinned by date;
      # every other build stays on rust-toolchain.toml's stable.
      FUZZ_TOOLCHAIN: nightly-2026-09-25
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - name: Install cargo-fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"
      # Ten minutes of recurrence expansion. A panic, a broken invariant, a 60-second input or a
      # 2 GB one fails the run and leaves the input under fuzz/artifacts.
      - name: Fuzz recurrence expansion
        working-directory: fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz run expand -- -max_total_time=600 -timeout=60 -rss_limit_mb=2048
      # Ten minutes of iCalendar parsing and write-back over arbitrary bytes. It runs even when
      # the expansion step failed, so one target's failure does not hide the other's.
      - name: Fuzz iCalendar round trip
        if: success() || failure()
        working-directory: fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz run ical_roundtrip -- -max_total_time=600 -timeout=60 -rss_limit_mb=2048
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  google-live:
    name: google live probes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # Probes a dedicated test calendar through the Google seam (crates/calendar-sync-google,
      # tests/live.rs). Until the probe account's secrets exist, the gate stays unset and the
      # suite reports that it skipped.
      - name: Probe Google Calendar
        env:
          CALENDAR_SYNC_GOOGLE_LIVE: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN != '' && '1' || '' }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: cargo test --locked -p calendar-sync-google --test live -- --ignored --nocapture
