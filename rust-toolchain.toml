# The toolchain every contributor and CI job builds with. rustup reads this file; mise does not manage Rust.
# The MSRV is separate: `rust-version` in Cargo.toml, checked by `mise run msrv`.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
