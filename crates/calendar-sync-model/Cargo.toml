[package]
name = "calendar-sync-model"
description = "Provider-neutral calendar event model: series, overrides, stable instance ids and time variants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/calendar-sync-model"
keywords = ["calendar", "event", "icalendar", "jscalendar", "sync"]
categories = ["date-and-time", "data-structures"]
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]
# docs/semver.md: the 0.x and MSRV policy this crate is released under.
publish = true

[dependencies]
jiff = { workspace = true, features = ["serde"] }
serde.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
