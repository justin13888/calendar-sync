[package]
name = "calendar-sync-recurrence"
description = "Recurrence window expansion over the calendar-sync event model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]
# Unpublished until this crate's release issue.
publish = false

[dependencies]
calendar-sync-model.workspace = true
jiff.workspace = true

[dev-dependencies]
# The tests need real zones. A library build never sees this feature: it reads zones only
# through the caller's `ZoneSource`.
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
