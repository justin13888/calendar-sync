[package]
name = "calendar-sync"
description = "Two-way calendar sync for Rust: event model, recurrence and a deterministic sync engine, with optional provider integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]
# Unpublished until this crate's release issue.
publish = false

[features]
default = []
## iCalendar mapping (`calendar-sync-ical`).
ical = ["dep:calendar-sync-ical"]
## Google Calendar provider (`calendar-sync-google`).
google = ["dep:calendar-sync-google"]
## Microsoft Graph provider (`calendar-sync-graph`).
graph = ["dep:calendar-sync-graph"]
## CalDAV provider (`calendar-sync-caldav`). Native only.
caldav = ["dep:calendar-sync-caldav"]

[dependencies]
calendar-sync-model.workspace = true
calendar-sync-recurrence.workspace = true
calendar-sync-engine.workspace = true
calendar-sync-ical = { workspace = true, optional = true }
calendar-sync-google = { workspace = true, optional = true }
calendar-sync-graph = { workspace = true, optional = true }
calendar-sync-caldav = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
