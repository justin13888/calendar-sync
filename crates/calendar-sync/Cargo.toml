[package]
name = "calendar-sync"
description = "Two-way calendar sync for Rust: event model, recurrence and a deterministic sync engine, with optional provider integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/calendar-sync"
keywords.workspace = true
categories = ["date-and-time"]
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]
# docs/semver.md: the 0.x and MSRV policy this crate is released under.
publish = true

# Only published crates may appear here, optional ones included: crates.io must resolve every
# dependency of a package it accepts. The engine and the `ical`, `google`, `graph` and `caldav`
# features come back as their crates publish (docs/semver.md, "Facade").
[dependencies]
calendar-sync-model.workspace = true
calendar-sync-recurrence.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
