[package]
name = "calendar-sync-google"
description = "Google Calendar mapping and thin REST client for calendar-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]
# Unpublished until this crate's release issue.
publish = false

[dependencies]
calendar-sync-engine.workspace = true
calendar-sync-ical.workspace = true
calendar-sync-model.workspace = true
# `tzdb-bundle-always` compiles in the IANA database that zoned times are read with, never a file.
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
serde_json.workspace = true

[dev-dependencies]
calendar-sync-testkit.workspace = true

[lints]
workspace = true
