# Tools and tasks for calendar-sync.
#
# Rust itself is managed by rustup from rust-toolchain.toml, not by mise.
# Every tool here is a prebuilt binary pinned to an exact version.

[tools]
# Hooks and commit convention
hk = "2.11.0"
pkl = "0.32.2"
cocogitto = "7.0.0"
# Cargo subcommands
cargo-deny = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
"github:taiki-e/cargo-hack" = "0.6.46"
"github:obi1kenobi/cargo-semver-checks" = "0.51.0"
release-plz = "0.4.3"
git-cliff = "2.14.2"
# Linters
taplo = "0.10.0"
typos = "1.52.0"
actionlint = "1.7.12"
# actionlint runs shellcheck over workflow `run:` scripts when it is on PATH.
shellcheck = "0.11.0"
zizmor = "1.32.0"

[env]
# The MSRV that `mise run msrv` checks against. It must match `rust-version` in Cargo.toml.
MSRV = "1.91"

[tasks.setup]
description = "Install the pinned Rust toolchain and the git hooks"
run = ["rustup toolchain install", "rustup show active-toolchain", "hk install --mise"]

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.fix]
description = "Run every hk linter in fix mode over the whole tree"
run = "hk fix --all"

[tasks.lint]
description = "Run every hk linter in check mode over the whole tree"
run = "hk check --all"

[tasks.toolchain]
description = "Assert rustc matches rust-toolchain.toml and rust-version matches the MSRV"
run = "cargo xtask toolchain"

[tasks.clippy]
description = "Lint every target and feature, denying warnings"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks.test]
description = "Run the test suite with nextest, then the doctests"
run = [
  "cargo nextest run --workspace --all-features --locked",
  "cargo test --doc --workspace --all-features --locked",
]

[tasks.doc]
description = "Build the docs, denying warnings"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --all-features --no-deps --locked"

[tasks.wasm]
description = "Build and lint the pure crates for wasm32-unknown-unknown"
run = [
  "cargo build --locked --target wasm32-unknown-unknown -p calendar-sync-model -p calendar-sync-recurrence -p calendar-sync-engine -p calendar-sync-ical",
  "cargo clippy --locked --target wasm32-unknown-unknown -p calendar-sync-model -p calendar-sync-recurrence -p calendar-sync-engine -p calendar-sync-ical -- -D warnings",
]

[tasks.purity]
description = "Check the pure crates' dependency graphs and sources, and prove the purity fixture fails clippy"
run = ["cargo xtask purity", "cargo xtask fixture purity"]

[tasks.deny]
description = "Run cargo-deny, and prove the deny fixture's copyleft dependency is rejected"
run = ["cargo deny --all-features check", "cargo xtask fixture deny"]

[tasks.msrv]
description = "Check the workspace builds on the MSRV"
run = [
  "rustup toolchain install $MSRV --profile minimal",
  "cargo hack check --rust-version --workspace --all-targets --all-features --locked",
]

[tasks.semver]
description = "Check published crates for semver violations"
run = "cargo semver-checks --workspace --all-features"

[tasks."references:verify"]
description = "Check references/ offline: checksums match, every file is listed, README and SHA256SUMS agree"
run = "cargo xtask references verify"

[tasks."references:upstream"]
description = "Download every vendored reference again and compare it with its checksum"
run = "cargo xtask references upstream"

[tasks."gen:windows-zones"]
description = "Generate the Graph crate's Windows time zone table from the vendored CLDR data"
run = "cargo xtask gen-windows-zones"

[tasks."gen:windows-zones:check"]
description = "Check the Graph crate's Windows time zone table matches what the vendored CLDR data generates"
run = "cargo xtask gen-windows-zones --check"

[tasks."commits:check"]
description = "Check every commit on the branch follows the commit convention"
run = "cog check"

[tasks.ci]
description = "Run every CI gate locally, in order"
run = [
  "mise run toolchain",
  "mise run lint",
  "mise run clippy",
  "mise run test",
  "mise run doc",
  "mise run wasm",
  "mise run purity",
  "mise run deny",
  "mise run msrv",
  "mise run semver",
  "mise run references:verify",
  "mise run gen:windows-zones:check",
  "mise run commits:check",
]
