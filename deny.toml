# cargo-deny policy. `mise run deny` checks the workspace, then proves the deny fixture's
# copyleft dependency is rejected.

[graph]
all-features = true

[advisories]
# Unmaintained and unsound advisories fail too, not only vulnerabilities.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. No copyleft, in any dependency.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this repository are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
